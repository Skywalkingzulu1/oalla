<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <style>
    /* === CSS Variables === */
    :root {
      --primary-color: #001a2e;
      /* dark header/nav */
      --primary-dark: #0b141a;
      /* darker background shade */
      --primary-light: #202c33;
      /* lighter panel background */
      --secondary-color: #00a884;
      /* WhatsApp green accent */
      --secondary-dark: #018069;
      /* darker green hover */
      --danger-color: #e35454;
      --warning-color: #fbbf24;
      --background: #0b141a;
      /* main app background */
      /* --surface: #202c33; */
      --surface: #001a2e;
      /* chat/message box */
      --text-primary: #e9edef;
      /* primary white-ish text */
      --text-secondary: #8696a0;
      /* secondary gray text */
      --text-tertiary: #667781;
      /* tertiary lighter gray */
      /* --border-color: #2a3942; */
      --border-color: #001a2e;
      /* subtle border lines */
      --user-bubble: #005c4b;
      /* dark green for user message */
      --assistant-bubble: #1e2a32;
      /* darker surface for assistant */
      --chat-background: #121b22;
      --input-text-background: #2c3c47;
      /* chat area */
    }

    /* === Reset === */
    * {
      box-sizing: border-box;
    }

    .unallow-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === Header === */
    header {
      background: var(--primary-color);
      color: white;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      text-shadow: 0 0 4px rgba(0, 168, 132, 0.25);
    }

    .model-selector-wrapper select {
      font-size: 0.875rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--secondary-color);
      background: var(--primary-light);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .model-selector-wrapper select:hover {
      border-color: var(--secondary-dark);
      background: var(--primary-color);
    }

    .model-selector-wrapper select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }

    header select {
      font-size: 0.875rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
      cursor: pointer;
    }

    /* === Mobile Wrapper === */
    .mobile-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* === Screens === */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background-color: var(--background);
    }

    .screen.active {
      display: flex;
    }

    /* === Search Bar === */
    .search-bar {
      padding: 0.75rem;
      background: var(--surface);
      position: relative;
      border-bottom: 1px solid var(--border-color);
    }

    .search-bar input {
      width: 100%;
      padding: 0.625rem 2.5rem 0.625rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(7, 94, 84, 0.1);
    }

    #clearSearchBtn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      color: var(--text-tertiary);
      padding: 0.25rem;
      border-radius: 50%;
      transition: all 0.2s;
      width: 28px;
      height: 28px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #clearSearchBtn:hover {
      color: var(--text-secondary);
      background: var(--background);
    }

    #clearSearchBtn svg {
      width: 16px;
      height: 16px;
    }

    /* === Chat List === */
    .chat-list {
      flex: 1;
      background: var(--surface);
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
    }

    .chat-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-item:hover {
      background: var(--background);
    }

    .chat-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .chat-item-title {
      font-weight: 500;
      color: var(--text-primary);
    }

    .chat-item-time {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-top: 0.25rem;
    }

    /* === Chat Header === */
    .chat-header {
      padding: 0.75rem 1rem;
      background: var(--surface);
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-button {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button:hover {
      background: var(--background);
    }

    .back-button svg {
      width: 24px;
      height: 24px;
    }

    /* === Chat Box === */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      /* background-image: url('bg-indo-species.webp'); */
      background-image: url('indo-species-2.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* === Messages === */
    .message-wrapper {
      display: flex;
      margin: 0.3rem 0;
    }

    .message-wrapper.user {
      justify-content: flex-end;
    }

    .message-wrapper.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .message-wrapper.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .message-wrapper.assistant .bubble {
      background: var(--assistant-bubble);
      border-bottom-left-radius: 4px;
    }

    .text {
      font-size: 0.9375rem;
      margin-bottom: 0.3rem;
      line-height: 1.4;
      color: var(--text-primary);
    }

    .meta {
      font-size: 0.7rem;
      text-align: right;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* === Input Area === */
    #searchInput {
      background: var(--input-text-background);
      color: var(--text-primary);
    }

    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-text-background);
      border-radius: 24px;
      padding-right: 2.5rem;
      width: 100%;
      border: 1px solid var(--border-color);
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
    }

    .input-wrapper textarea {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      resize: none;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border-radius: 24px;
      min-height: 40px;
      max-height: 100px;
      outline: none;
      font-family: inherit;
    }

    .send-button {
      position: absolute;
      right: 0.3rem;
      bottom: 0.3rem;
      top: 0.7rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--secondary-color);
      color: white;
      border: none;
      font-size: 1.2rem;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-button:hover {
      background: var(--secondary-dark);
      transform: scale(1.05);
    }

    .send-button svg {
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
    }

    /* === Footer === */
    .footer {
      display: flex;
      justify-content: space-around;
      padding: 0.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border-color);
    }

    .footer button {
      flex: 1;
      margin: 0 0.5rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.875rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .footer button:hover {
      background: var(--background);
      color: var(--primary-color);
    }

    .footer button.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .footer button span:first-child {
      font-size: 1.25rem;
    }

    /* === Download Area === */
    .download-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      background: var(--surface);
      overflow-y: auto;
    }

    .download-area h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .download-area label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .download-area input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }

    .download-area input:focus {
      border-color: var(--primary-color);
    }

    .download-area button {
      padding: 0.75rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .download-area button:hover {
      background: var(--primary-dark);
    }

    .progress {
      font-size: 0.8rem;
      margin-top: 1rem;
      color: #0f0;
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 8px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .model-list {
      margin-top: 1.5rem;
    }

    .model-list h3 {
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .model-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--background);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .model-item button {
      background: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.375rem 0.75rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }

    .model-item button:hover {
      background: #dc2626;
    }

    /* === Model & History === */
    .model-name {
      font-size: 0.65rem;
      color: #888;
      display: inline-block;
      margin-left: 4px;
    }

    .history-nav {
      font-size: 0.65rem;
      color: #999;
      background: rgba(0, 0, 0, 0.05);
      padding: 0.125rem 0.375rem;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .history-nav button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.125rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #666;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .history-nav button:hover {
      background: rgba(0, 0, 0, 0.1);
      color: var(--primary-color);
    }

    .history-nav button svg {
      width: 12px;
      height: 12px;
    }

    .model-change-button {
      border: none;
      background: none;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 0.4rem;
      color: #888;
      padding: 0.125rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .model-change-button:hover {
      color: var(--primary-color);
      background: rgba(0, 0, 0, 0.05);
    }

    .model-change-button svg {
      width: 14px;
      height: 14px;
    }

    .model-dropdown {
      position: absolute;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.8rem;
      z-index: 999;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      min-width: 140px;
      white-space: nowrap;
    }

    .model-dropdown div {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
    }

    .model-dropdown div:hover {
      background-color: #f5f5f5;
    }

    .model-dropdown div:first-child {
      border-radius: 8px 8px 0 0;
    }

    .model-dropdown div:last-child {
      border-radius: 0 0 8px 8px;
    }

    .cancel-button {
      border: none;
      background: var(--danger-color);
      color: white;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      align-self: flex-end;
      margin-top: 0.5rem;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .cancel-button:hover {
      background: #dc2626;
    }

    .cancel-button svg {
      width: 14px;
      height: 14px;
    }

    /* === Modal === */
    #chatActionModal {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 1.5rem 1rem;
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    #modalTitle {
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: var(--text-primary);
    }

    #chatActionModal button {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      font-weight: 500;
    }

    #chatActionModal button:not(:last-child) {
      margin-bottom: 0.5rem;
    }

    /* === Date Divider === */
    .date-divider {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin: 1rem 0;
      position: relative;
    }

    .date-divider::before,
    .date-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 36%;
      height: 1px;
      background: #ffffff1a;
    }

    .date-divider::before {
      left: 0;
    }

    .date-divider::after {
      right: 0;
    }

    /* === Empty State === */
    .empty-state {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--text-tertiary);
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <header class="unallow-select">
    <div class="logo">
      <img src="./oala-logo-flat-horizontal.svg" alt="Ollama Logo" style="height: 26px;" />
    </div>
    <div class="model-selector-wrapper">
      <select id="modelSelect" onchange="updateModelLabel()">
        <!-- Models will be populated dynamically -->
      </select>
    </div>
  </header>

  <div class="mobile-wrapper">
    <!-- Topic Screen -->
    <div id="topicScreen" class="screen active">
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="Search conversations..." oninput="onSearchInput(this)">
        <button id="clearSearchBtn" onclick="clearSearch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="quickInput" placeholder="Ask me anything…" oninput="toggleQuickSend()"></textarea>
          <button id="quickSendBtn" class="send-button" onclick="quickSend()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="screen">
      <div class="chat-header">
        <button class="back-button" onclick="showScreen('topic')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="19 12 5 12"></polyline>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <span style="flex: 1; font-weight: 500;">Chat</span>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="userInput" placeholder="Ask anything" oninput="toggleSendButton()"></textarea>
          <button id="sendBtn" onclick="sendMessage()" class="send-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Download Screen -->
    <div id="downloadScreen" class="screen">
      <div class="download-area">
        <h2>Model Management</h2>
        <label for="modelUrl">Model Name</label>
        <input type="text" id="modelUrl" placeholder="e.g. llama3, deepseek-r1">
        <button onclick="downloadModel()">Pull Model</button>
        <div class="progress" id="downloadProgress">Ready to download...</div>
        <div class="model-list">
          <h3>Installed Models</h3>
          <div id="modelList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- <div class="footer">
    <button id="navChat" class="active" onclick="showScreen('topic')">
      <span>💬</span>
      <span>Chats</span>
    </button>
    <button id="navModels" onclick="showScreen('download')">
      <span>📦</span>
      <span>Models</span>
    </button>
  </div> -->

  <!-- Chat Action Modal -->
  <div id="chatActionModal" class="unallow-select">
    <div id="modalTitle"></div>
    <button onclick="confirmPinAction()" style="background:#0f766e; color:white;">
      📌 Pin/Unpin
    </button>
    <button onclick="confirmDeleteAction()" style="background:#ef4444; color:white;">
      🗑️ Delete
    </button>
    <button onclick="closeModal()" style="background:#f3f4f6; color:#333;">
      Cancel
    </button>
  </div>

  <script>
    // === Application State ===
    const AppState = {
      currentChatId: null,
      chats: JSON.parse(localStorage.getItem('ollamaChats') || '{}'),
      pinnedTopics: JSON.parse(localStorage.getItem('pinnedTopics') || '[]'),
      isGenerating: false,
      controller: null,
      editIndex: null,
      lastSearchQuery: '',
      selectedTopicId: null,
      longPressTimer: null,
      searchDebounceTimer: null
    };

    // === Configuration ===
    const Config = {
      API_ENDPOINTS: {
        CHAT: '/api/chat',
        TAGS: '/api/tags',
        DELETE: '/api/delete',
        PULL: '/api/pull'
      },
      LONG_PRESS_DURATION: 600,
      SEARCH_DEBOUNCE_DELAY: 300,
      MESSAGE_PREVIEW_LENGTH: 80,
      TOPIC_TITLE_MAX_WORDS: 12
    };

    // === DOM Elements Cache ===
    const DOM = {
      get modelSelect() { return document.getElementById('modelSelect'); },
      get chatBox() { return document.getElementById('chatBox'); },
      get userInput() { return document.getElementById('userInput'); },
      get sendBtn() { return document.getElementById('sendBtn'); },
      get searchInput() { return document.getElementById('searchInput'); },
      get clearSearchBtn() { return document.getElementById('clearSearchBtn'); },
      get quickInput() { return document.getElementById('quickInput'); },
      get quickSendBtn() { return document.getElementById('quickSendBtn'); },
      get chatList() { return document.getElementById('chatList'); },
      get modelList() { return document.getElementById('modelList'); },
      get downloadProgress() { return document.getElementById('downloadProgress'); },
      get modelUrl() { return document.getElementById('modelUrl'); },
      get modal() { return document.getElementById('chatActionModal'); },
      get modalTitle() { return document.getElementById('modalTitle'); }
    };

    // === API Service ===
    const API = {
      async fetchModels() {
        try {
          const response = await fetch(Config.API_ENDPOINTS.TAGS);
          const data = await response.json();
          return data.models || [];
        } catch (error) {
          console.error('Failed to fetch models:', error);
          return [];
        }
      },

      async deleteModel(name) {
        try {
          await fetch(Config.API_ENDPOINTS.DELETE, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          return true;
        } catch (error) {
          console.error('Failed to delete model:', error);
          return false;
        }
      },

      async pullModel(name) {
        const response = await fetch(Config.API_ENDPOINTS.PULL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        return response.body.getReader();
      },

      async createChatStream(model, messages, signal) {
        const response = await fetch(Config.API_ENDPOINTS.CHAT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, messages, stream: true }),
          signal
        });
        return response.body.getReader();
      }
    };

    // === Storage Manager ===
    const Storage = {
      saveChats() {
        localStorage.setItem('ollamaChats', JSON.stringify(AppState.chats));
      },

      savePinnedTopics() {
        localStorage.setItem('pinnedTopics', JSON.stringify(AppState.pinnedTopics));
      },

      saveSelectedModel(model) {
        localStorage.setItem('selectedModel', model);
      },

      getSelectedModel() {
        return localStorage.getItem('selectedModel');
      }
    };

    // === Utility Functions ===
    const Utils = {
      formatTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });
      },

      formatDateLabel(date) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);

        const compareDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        if (compareDate.getTime() === today.getTime()) return 'Today';
        if (compareDate.getTime() === yesterday.getTime()) return 'Yesterday';

        return date.toLocaleDateString();
      },

      formatRelativeDateTime(timestamp) {
        const date = new Date(timestamp);
        const label = this.formatDateLabel(date);
        const time = this.formatTime(timestamp);
        return `${label} ${time}`;
      },

      generateTopicTitle(message) {
        const words = message.trim().split(/\s+/);
        return words.length > Config.TOPIC_TITLE_MAX_WORDS
          ? words.slice(0, Config.TOPIC_TITLE_MAX_WORDS).join(' ') + '...'
          : message;
      },

      extractTopicTitle(id) {
        return id.split(' #')[0];
      },

      debounce(func, delay = Config.SEARCH_DEBOUNCE_DELAY) {
        clearTimeout(AppState.searchDebounceTimer);
        AppState.searchDebounceTimer = setTimeout(func, delay);
      },

      async streamToText(reader, onChunk) {
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          buffer += chunk;
          const parts = buffer.split('\n');
          buffer = parts.pop();

          for (const part of parts) {
            if (part.trim()) {
              try {
                const json = JSON.parse(part);
                const token = json.message?.content || '';
                onChunk(token);
              } catch (e) {
                console.error('Failed to parse chunk:', e);
              }
            }
          }
        }
      }
    };

    // === Screen Manager ===
    const ScreenManager = {
      show(screenName) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.footer button').forEach(b => b.classList.remove('active'));

        switch (screenName) {
          case 'topic':
            document.getElementById('topicScreen').classList.add('active');
            // document.getElementById('navChat').classList.add('active');
            this.handleTopicScreen();
            break;
          case 'chat':
            document.getElementById('chatScreen').classList.add('active');
            // document.getElementById('navChat').classList.add('active');
            break;
        }
      },

      handleTopicScreen() {
        if (!AppState.lastSearchQuery) {
          DOM.searchInput.value = '';
          ChatListManager.render();
        } else {
          DOM.searchInput.value = AppState.lastSearchQuery;
          SearchManager.search(AppState.lastSearchQuery);
        }
      }
    };

    // === Chat Manager ===
    const ChatManager = {
      create(message) {
        const topic = Utils.generateTopicTitle(message || 'New Chat');
        const id = `${topic} #${Date.now()}`;
        AppState.chats[id] = [];
        AppState.currentChatId = id;
        Storage.saveChats();
        return id;
      },

      select(id) {
        AppState.currentChatId = id;
        ScreenManager.show('chat');
        MessageRenderer.render();
      },

      delete(id) {
        delete AppState.chats[id];
        AppState.pinnedTopics = AppState.pinnedTopics.filter(p => p !== id);
        Storage.saveChats();
        Storage.savePinnedTopics();
        ChatListManager.render();
      },

      togglePin(id) {
        const index = AppState.pinnedTopics.indexOf(id);
        if (index > -1) {
          AppState.pinnedTopics.splice(index, 1);
        } else {
          AppState.pinnedTopics.push(id);
        }
        Storage.savePinnedTopics();
        ChatListManager.render();
      }
    };

    // === Message Manager ===
    const MessageManager = {
      async send() {
        const content = DOM.userInput.value.trim();
        if (!content || !AppState.currentChatId || AppState.isGenerating) return;

        // Handle edit mode
        if (AppState.editIndex !== null) {
          this.updateMessage(AppState.editIndex, content);
        } else {
          this.addUserMessage(content);
        }

        // Reset UI
        DOM.userInput.value = '';
        DOM.userInput.disabled = true;
        DOM.sendBtn.disabled = true;
        UIManager.toggleSendButton();

        MessageRenderer.render();

        // Generate response
        await this.generateAssistantResponse();
      },

      addUserMessage(content) {
        AppState.chats[AppState.currentChatId].push({
          role: 'user',
          content,
          timestamp: Date.now()
        });
        Storage.saveChats();
      },

      updateMessage(index, content) {
        const messages = AppState.chats[AppState.currentChatId];
        messages[index].content = content;
        messages[index].timestamp = Date.now();

        // Remove messages after the edited one
        AppState.chats[AppState.currentChatId] = messages.slice(0, index + 1);
        AppState.editIndex = null;
        Storage.saveChats();
      },

      async generateAssistantResponse() {
        const tempDiv = this.createPendingMessage();
        const textDiv = tempDiv.querySelector('.text');
        let assistantText = '';

        AppState.controller = new AbortController();
        AppState.isGenerating = true;

        const stopButton = UIManager.createStopButton(
          () => AppState.controller.abort(),
          tempDiv
        );

        try {
          const reader = await API.createChatStream(
            DOM.modelSelect.value,
            AppState.chats[AppState.currentChatId],
            AppState.controller.signal
          );

          await Utils.streamToText(reader, (token) => {
            assistantText += token;
            textDiv.textContent = assistantText;
            DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('Stream failed:', err);
            textDiv.textContent = 'Error generating response. Please try again.';
          }
        } finally {
          this.cleanup(stopButton);

          if (assistantText) {
            this.addAssistantMessage(assistantText);
          }

          MessageRenderer.render();
        }
      },

      addAssistantMessage(content) {
        AppState.chats[AppState.currentChatId].push({
          role: 'assistant',
          content,
          timestamp: Date.now(),
          model: DOM.modelSelect.value,
          history: [content],
          selected: 0
        });
        Storage.saveChats();
      },

      createPendingMessage() {
        const div = document.createElement('div');
        div.className = 'message-wrapper assistant';
        div.innerHTML = `
          <div class="bubble">
            <div class="text"></div>
            <div class="meta unallow-select">...</div>
          </div>
        `;
        DOM.chatBox.appendChild(div);
        DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
        return div;
      },

      cleanup(stopButton) {
        AppState.controller = null;
        AppState.isGenerating = false;
        stopButton?.remove();
        DOM.userInput.disabled = false;
        DOM.sendBtn.disabled = false;
      },

      editMessage(index) {
        const msg = AppState.chats[AppState.currentChatId][index];
        if (!msg || msg.role !== 'user') return;

        DOM.userInput.value = msg.content;
        UIManager.toggleSendButton();
        AppState.editIndex = index;
        DOM.userInput.focus();
      }
    };

    // === Message Renderer ===
    const MessageRenderer = {
      render(callback) {
        DOM.chatBox.innerHTML = '';

        if (!AppState.currentChatId || !AppState.chats[AppState.currentChatId]) return;

        let lastDateLabel = '';
        const messages = AppState.chats[AppState.currentChatId];

        messages.forEach((msg, index) => {
          const msgDate = new Date(msg.timestamp || Date.now());
          const dateLabel = Utils.formatDateLabel(msgDate);

          if (dateLabel !== lastDateLabel) {
            this.renderDateDivider(dateLabel);
            lastDateLabel = dateLabel;
          }

          this.renderMessage(msg, index);
        });

        DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
        if (callback) callback();
      },

      renderDateDivider(label) {
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.textContent = `${label}`;
        DOM.chatBox.appendChild(div);
      },

      renderMessage(msg, index) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${msg.role}`;
        wrapper.dataset.index = index;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const text = document.createElement('div');
        text.className = 'text';
        const selected = msg.selected ?? 0;
        text.textContent = msg.history?.[selected] || msg.content;

        const meta = this.createMetaElement(msg, index);

        bubble.appendChild(text);
        bubble.appendChild(meta);
        wrapper.appendChild(bubble);
        DOM.chatBox.appendChild(wrapper);
      },

      createMetaElement(msg, index) {
        const meta = document.createElement('div');
        meta.className = 'meta';

        const time = Utils.formatTime(msg.timestamp || Date.now());
        const selected = msg.selected ?? 0;

        let actualModel = msg.model;
        if (msg.history?.length > 1 && msg.historyModels) {
          actualModel = msg.historyModels[selected] || msg.model;
        }

        const parts = [time];

        if (actualModel) {
          parts.push(`<span class="model-name">| ${actualModel}</span>`);
        }

        if (msg.role === 'assistant') {
          parts.push(`<span class="model-change-button" onclick="ModelManager.showDropdown(${index}, this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
            </svg>
          </span>`);
          parts.push(`<div class="model-dropdown" id="modelDropdown-${index}" style="display:none;"></div>`);
        } else if (msg.role === 'user') {
          parts.push(`<span class="model-change-button" onclick="MessageManager.editMessage(${index})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </span>`);
        }

        if (msg.history?.length > 1) {
          parts.push(`
            <span class="history-nav">
              <button onclick="HistoryManager.navigate(${index}, -1)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"/>
                </svg>
              </button>
              ${selected + 1} / ${msg.history.length}
              <button onclick="HistoryManager.navigate(${index}, 1)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </button>
            </span>
          `);
        }

        meta.innerHTML = parts.join(' ');
        return meta;
      }
    };

    // === Model Manager ===
    const ModelManager = {
      async load() {
        const models = await API.fetchModels();
        this.populateSelect(models);
        this.populateList(models);
      },

      populateSelect(models) {
        DOM.modelSelect.innerHTML = '';
        const savedModel = Storage.getSelectedModel();
        let modelExists = false;

        models.forEach(model => {
          const option = document.createElement('option');
          option.value = model.name;
          option.textContent = model.name;

          if (model.name === savedModel) {
            modelExists = true;
          }

          DOM.modelSelect.appendChild(option);
        });

        if (modelExists) {
          DOM.modelSelect.value = savedModel;
        } else if (models.length > 0) {
          DOM.modelSelect.value = models[0].name;
          this.updateLabel();
        }
      },

      populateList(models) {
        DOM.modelList.innerHTML = '';

        if (models.length === 0) {
          DOM.modelList.innerHTML = '<div class="empty-state">No models installed yet.</div>';
          return;
        }

        models.forEach(model => {
          const item = document.createElement('div');
          item.className = 'model-item';
          item.innerHTML = `
            <span>${model.name}</span>
            <button onclick="ModelManager.delete('${model.name}')">🗑️ Delete</button>
          `;
          DOM.modelList.appendChild(item);
        });
      },

      async delete(name) {
        if (!confirm(`Delete model: ${name}?`)) return;

        const success = await API.deleteModel(name);
        if (success) {
          await this.load();
        } else {
          alert('Failed to delete model');
        }
      },

      async download() {
        const name = DOM.modelUrl.value.trim();
        if (!name) {
          alert('Please enter a model name');
          return;
        }

        DOM.downloadProgress.textContent = 'Starting model pull...\n';

        try {
          const reader = await API.pullModel(name);

          await Utils.streamToText(reader, (chunk) => {
            DOM.downloadProgress.textContent += chunk + '\n';
            DOM.downloadProgress.scrollTop = DOM.downloadProgress.scrollHeight;
          });

          DOM.downloadProgress.textContent += '\n✅ Download complete!';
          DOM.modelUrl.value = '';
          await this.load();
        } catch (err) {
          DOM.downloadProgress.textContent += `\n❌ Error: ${err.message}`;
        }
      },

      updateLabel() {
        Storage.saveSelectedModel(DOM.modelSelect.value);
      },

      showDropdown(index, buttonElem) {
        const dropdown = document.getElementById(`modelDropdown-${index}`);
        dropdown.innerHTML = '';

        const models = Array.from(DOM.modelSelect.options).map(opt => opt.value);

        models.forEach(model => {
          const item = document.createElement('div');
          item.textContent = model;
          item.onclick = () => {
            this.changeForMessage(index, model);
            dropdown.style.display = 'none';
          };
          dropdown.appendChild(item);
        });

        // Position dropdown
        const parent = buttonElem.closest('.meta');
        parent.style.position = 'relative';
        dropdown.style.left = `${buttonElem.offsetLeft}px`;
        dropdown.style.top = `${buttonElem.offsetTop + buttonElem.offsetHeight + 4}px`;
        dropdown.style.display = 'block';
      },

      async changeForMessage(index, newModel) {
        const msg = AppState.chats[AppState.currentChatId][index];
        if (!newModel || newModel === msg.model) return;

        // Initialize history
        msg.history = msg.history || [msg.content];
        msg.historyModels = msg.historyModels || [msg.model];
        msg.history.push('');
        msg.historyModels.push(newModel);
        msg.selected = msg.history.length - 1;
        msg.model = newModel;

        MessageRenderer.render();

        // Generate new response
        await this.regenerateWithModel(index, newModel);
      },

      async regenerateWithModel(index, model) {
        const targetDiv = document.querySelector(`.message-wrapper.assistant[data-index="${index}"]`);
        const textDiv = targetDiv.querySelector('.text');
        const msg = AppState.chats[AppState.currentChatId][index];

        textDiv.textContent = '';

        AppState.controller = new AbortController();
        AppState.isGenerating = true;

        const stopButton = UIManager.createStopButton(
          () => AppState.controller.abort(),
          targetDiv
        );

        try {
          const messagesUntilNow = AppState.chats[AppState.currentChatId].slice(0, index);
          const reader = await API.createChatStream(model, messagesUntilNow, AppState.controller.signal);

          let assistantText = '';
          await Utils.streamToText(reader, (token) => {
            assistantText += token;
            msg.history[msg.selected] = assistantText;
            textDiv.textContent = assistantText;
            DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('Model change failed:', err);
          }
        } finally {
          AppState.controller = null;
          AppState.isGenerating = false;
          stopButton?.remove();
          Storage.saveChats();
          MessageRenderer.render();
        }
      }
    };

    // === History Manager ===
    const HistoryManager = {
      navigate(index, direction) {
        const msg = AppState.chats[AppState.currentChatId][index];
        if (!msg.history || msg.history.length < 2) return;

        msg.selected = (msg.selected + direction + msg.history.length) % msg.history.length;
        Storage.saveChats();
        MessageRenderer.render();
      }
    };

    // === Search Manager ===
    const SearchManager = {
      onInput(input) {
        const value = input.value.trim();
        DOM.clearSearchBtn.style.display = value ? 'flex' : 'none';
        Utils.debounce(() => this.search(value));
      },

      clear() {
        DOM.searchInput.value = '';
        DOM.clearSearchBtn.style.display = 'none';
        AppState.lastSearchQuery = '';
        ChatListManager.render();
      },

      search(query) {
        DOM.chatList.innerHTML = '';

        query = query.trim().toLowerCase();
        AppState.lastSearchQuery = query;

        if (!query) {
          ChatListManager.render();
          return;
        }

        const results = this.findMessages(query);

        if (results.length === 0) {
          DOM.chatList.innerHTML = '<div class="empty-state">No messages found</div>';
          return;
        }

        this.renderResults(results);
      },

      findMessages(query) {
        const results = [];

        Object.entries(AppState.chats).forEach(([chatId, messages]) => {
          messages.forEach((msg, index) => {
            if (msg.content?.toLowerCase().includes(query)) {
              results.push({
                chatId,
                index,
                content: msg.content,
                timestamp: msg.timestamp || 0,
                role: msg.role
              });
            }
          });
        });

        return results.sort((a, b) => b.timestamp - a.timestamp);
      },

      renderResults(results) {
        results.forEach(result => {
          const item = this.createResultItem(result);
          DOM.chatList.appendChild(item);
        });
      },

      createResultItem(result) {
        const item = document.createElement('div');
        item.className = 'chat-item unallow-select';

        const preview = result.content.length > Config.MESSAGE_PREVIEW_LENGTH
          ? result.content.slice(0, Config.MESSAGE_PREVIEW_LENGTH - 3) + '...'
          : result.content;

        item.innerHTML = `
          <div class="chat-item-header">
            <span class="chat-item-title">${Utils.extractTopicTitle(result.chatId)}</span>
            <span style="font-size: 0.75rem; color: #888;">${result.role}</span>
          </div>
          <div style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">${preview}</div>
          <div class="chat-item-time">${Utils.formatRelativeDateTime(result.timestamp)}</div>
        `;

        item.onclick = () => {
          AppState.currentChatId = result.chatId;
          ScreenManager.show('chat');
          MessageRenderer.render(() => {
            setTimeout(() => this.scrollToMessage(result.index), 100);
          });
        };

        return item;
      },

      scrollToMessage(index) {
        const msgDiv = DOM.chatBox.querySelector(`.message-wrapper[data-index="${index}"]`);
        if (msgDiv) {
          msgDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
          msgDiv.style.background = '#fffbcc';
          setTimeout(() => msgDiv.style.background = '', 1500);
        }
      }
    };

    // === Chat List Manager ===
    const ChatListManager = {
      render() {
        DOM.chatList.innerHTML = '';

        const sortedChats = this.getSortedChats();

        if (sortedChats.length === 0) {
          DOM.chatList.innerHTML = '<div class="empty-state">No chats yet. Start a new conversation!</div>';
          return;
        }

        sortedChats.forEach(({ id, time }) => {
          const item = this.createChatItem(id, time);
          DOM.chatList.appendChild(item);
        });
      },

      getSortedChats() {
        return Object.entries(AppState.chats)
          .map(([id, messages]) => {
            const lastMsg = messages[messages.length - 1];
            return {
              id,
              time: lastMsg?.timestamp || 0,
              pinned: AppState.pinnedTopics.includes(id)
            };
          })
          .sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return b.time - a.time;
          });
      },

      createChatItem(id, timestamp) {
        const item = document.createElement('div');
        item.className = 'chat-item unallow-select';

        const isPinned = AppState.pinnedTopics.includes(id);
        const title = Utils.extractTopicTitle(id);
        const time = Utils.formatRelativeDateTime(timestamp);

        item.innerHTML = `
          <div class="chat-item-header">
            <span class="chat-item-title">${title}</span>
            ${isPinned ? '<span style="font-size: 1rem;">📌</span>' : ''}
          </div>
          <div class="chat-item-time">${time}</div>
        `;

        this.attachEventHandlers(item, id);
        return item;
      },

      attachEventHandlers(item, id) {
        // Enhanced long press state management
        let pressState = {
          timer: null,
          startX: 0,
          startY: 0,
          isPressed: false,
          longPressTriggered: false,
          touchIdentifier: null,
          scrollDetected: false,
          initialScroll: 0
        };

        const MOVEMENT_THRESHOLD = 10; // pixels
        const LONG_PRESS_DURATION = 600; // ms (reduced for better UX)
        const SCROLL_LOCK_DELAY = 150; // ms before we decide it's not a scroll

        const startLongPress = (e) => {
          pressState.isPressed = true;
          pressState.longPressTriggered = false;
          pressState.scrollDetected = false;

          // Store initial position and scroll
          if (e.type === 'touchstart') {
            const touch = e.touches[0];
            pressState.startX = touch.clientX;
            pressState.startY = touch.clientY;
            pressState.touchIdentifier = touch.identifier;
            pressState.initialScroll = DOM.chatList.scrollTop;
          } else {
            pressState.startX = e.clientX;
            pressState.startY = e.clientY;
            pressState.initialScroll = DOM.chatList.scrollTop;
          }

          // Start a timer to check if this is a scroll or long press
          setTimeout(() => {
            if (pressState.isPressed && !pressState.scrollDetected) {
              // Only prevent default after we're sure it's not a scroll
              item.style.opacity = '0.8';
              item.style.transform = 'scale(0.98)';
              item.style.transition = 'all 0.1s ease';
            }
          }, SCROLL_LOCK_DELAY);

          // Start the long press timer
          pressState.timer = setTimeout(() => {
            if (pressState.isPressed && !pressState.scrollDetected) {
              pressState.longPressTriggered = true;

              // Haptic feedback if available
              if (navigator.vibrate) {
                navigator.vibrate(50);
              }

              // Show modal
              AppState.selectedTopicId = id;
              ModalManager.show(id);

              // Reset visual state
              resetVisualState();
            }
          }, LONG_PRESS_DURATION);
        };

        const checkMovement = (e) => {
          if (!pressState.isPressed) return;

          let currentX, currentY;

          if (e.type === 'touchmove') {
            const touch = Array.from(e.touches).find(t => t.identifier === pressState.touchIdentifier);
            if (!touch) {
              cancelLongPress();
              return;
            }
            currentX = touch.clientX;
            currentY = touch.clientY;
          } else {
            currentX = e.clientX;
            currentY = e.clientY;
          }

          // Calculate movement distance
          const deltaX = Math.abs(currentX - pressState.startX);
          const deltaY = Math.abs(currentY - pressState.startY);

          // Check if scrolling
          const scrollDelta = Math.abs(DOM.chatList.scrollTop - pressState.initialScroll);

          // If significant movement or scroll detected, cancel long press
          if (deltaX > MOVEMENT_THRESHOLD || deltaY > MOVEMENT_THRESHOLD || scrollDelta > 5) {
            pressState.scrollDetected = true;
            cancelLongPress();
          }
        };

        const cancelLongPress = () => {
          if (pressState.timer) {
            clearTimeout(pressState.timer);
            pressState.timer = null;
          }
          pressState.isPressed = false;
          resetVisualState();
        };

        const resetVisualState = () => {
          item.style.opacity = '';
          item.style.transform = '';
          item.style.transition = '';
        };

        const handleEnd = (e) => {
          const wasPressed = pressState.isPressed;
          const wasLongPress = pressState.longPressTriggered;
          const wasScroll = pressState.scrollDetected;

          cancelLongPress();

          // Handle regular click only if it wasn't a long press or scroll
          if (wasPressed && !wasLongPress && !wasScroll) {
            // Small delay to ensure this isn't part of a scroll gesture
            setTimeout(() => {
              ChatManager.select(id);
            }, 50);
          }
        };

        // Touch events - using passive for better scroll performance
        item.addEventListener('touchstart', startLongPress, { passive: true });
        item.addEventListener('touchmove', checkMovement, { passive: true });
        item.addEventListener('touchend', handleEnd, { passive: true });
        item.addEventListener('touchcancel', cancelLongPress, { passive: true });

        // Mouse events (for desktop)
        item.addEventListener('mousedown', startLongPress);
        item.addEventListener('mousemove', checkMovement);
        item.addEventListener('mouseup', handleEnd);
        item.addEventListener('mouseleave', cancelLongPress);

        // Prevent context menu on long press (desktop)
        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          return false;
        });
      }
    };

    // === Modal Manager ===
    const ModalManager = {
      show(topicId) {
        DOM.modalTitle.textContent = `Actions for: ${Utils.extractTopicTitle(topicId)}`;
        DOM.modal.style.display = 'block';
      },

      close() {
        DOM.modal.style.display = 'none';
        AppState.selectedTopicId = null;
      },

      confirmPin() {
        if (!AppState.selectedTopicId) return;
        ChatManager.togglePin(AppState.selectedTopicId);
        this.close();
      },

      confirmDelete() {
        if (!AppState.selectedTopicId) return;

        if (confirm(`Delete topic: ${Utils.extractTopicTitle(AppState.selectedTopicId)}?`)) {
          ChatManager.delete(AppState.selectedTopicId);
        }

        this.close();
      }
    };

    // === UI Manager ===
    const UIManager = {
      toggleSendButton() {
        DOM.sendBtn.style.display = DOM.userInput.value.trim() ? 'inline-flex' : 'none';
      },

      toggleQuickSend() {
        DOM.quickSendBtn.style.display = DOM.quickInput.value.trim() ? 'flex' : 'none';
      },

      createStopButton(onStop, targetDiv) {
        const existing = document.getElementById('stopButton');
        if (existing) existing.remove();

        const wrapper = targetDiv || [...DOM.chatBox.querySelectorAll('.message-wrapper.assistant')].pop();
        if (!wrapper) return null;

        const bubble = wrapper.querySelector('.bubble');
        if (!bubble) return null;

        const stopButton = document.createElement('button');
        stopButton.id = 'stopButton';
        stopButton.className = 'cancel-button';
        stopButton.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          </svg>
          <span style="margin-left: 0.375rem;">Stop</span>
        `;
        stopButton.onclick = onStop;
        bubble.appendChild(stopButton);

        return stopButton;
      }
    };

    // === Quick Send Manager ===
    const QuickSendManager = {
      send() {
        const message = DOM.quickInput.value.trim();
        if (!message) return;

        const chatId = ChatManager.create(message);
        DOM.quickInput.value = '';
        UIManager.toggleQuickSend();

        // Copy message to main input and send
        DOM.userInput.value = message;
        UIManager.toggleSendButton();

        ScreenManager.show('chat');
        MessageRenderer.render();
        MessageManager.send();
      }
    };

    // === Event Handlers ===
    const EventHandlers = {
      init() {
        // Global click handler for dropdowns
        document.addEventListener('click', (e) => {
          const dropdowns = document.querySelectorAll('.model-dropdown');
          dropdowns.forEach(dropdown => {
            const button = dropdown.previousElementSibling;
            if (!dropdown.contains(e.target) && !button?.contains(e.target)) {
              dropdown.style.display = 'none';
            }
          });
        });

        // Keyboard shortcuts
        DOM.userInput?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            MessageManager.send();
          }
        });

        DOM.quickInput?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            QuickSendManager.send();
          }
        });
      }
    };

    // === Initialize Application ===
    async function initializeApp() {
      await ModelManager.load();
      ChatListManager.render();
      EventHandlers.init();
    }

    // === Public API (for onclick handlers in HTML) ===
    window.showScreen = (name) => ScreenManager.show(name);
    window.sendMessage = () => MessageManager.send();
    window.toggleSendButton = () => UIManager.toggleSendButton();
    window.toggleQuickSend = () => UIManager.toggleQuickSend();
    window.quickSend = () => QuickSendManager.send();
    window.onSearchInput = (input) => SearchManager.onInput(input);
    window.clearSearch = () => SearchManager.clear();
    window.updateModelLabel = () => ModelManager.updateLabel();
    window.deleteModel = (name) => ModelManager.delete(name);
    window.downloadModel = () => ModelManager.download();
    window.showModelDropdown = (index, elem) => ModelManager.showDropdown(index, elem);
    window.editMessage = (index) => MessageManager.editMessage(index);
    window.navigateHistory = (index, dir) => HistoryManager.navigate(index, dir);
    window.confirmPinAction = () => ModalManager.confirmPin();
    window.confirmDeleteAction = () => ModalManager.confirmDelete();
    window.closeModal = () => ModalManager.close();
    window.ModelManager = ModelManager;
    window.MessageManager = MessageManager;
    window.HistoryManager = HistoryManager;

    // Start the application
    initializeApp();
  </script>
</body>

</html>
