name: Build WheelMD APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cross-compile Ollama for Android ARM64
        working-directory: external/ollama
        run: |
          export NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          export TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
          export CXX="$PWD/android-clang-wrapper.sh"
          export CGO_LDFLAGS="-ldl -llog -lm -lstdc++"
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC=$CC CXX=$CXX \
            go build -buildmode=c-shared -ldflags="-linkmode=external" -o libollama.so android-main.go

      - name: Build JNI bridge
        working-directory: external/ollama
        run: |
          COMPILER=$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          $COMPILER \
            -fPIC -shared \
            -o libbridgeollama.so \
            jni_bridgeollama.cpp \
            -L. -lollama

      - name: Copy native libraries
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp external/ollama/libollama.so android/app/src/main/jniLibs/arm64-v8a/
          cp external/ollama/libbridgeollama.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wheelmd-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WheelMD v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
